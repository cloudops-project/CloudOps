[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudops-api"
version = "0.1.0"
description = "CloudOps Stage 1 identity and tenant administration API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13,<1.19",
  "argon2-cffi>=23.1,<26",
  "boto3>=1.35,<2",
  "cryptography>=50.0.0,<51",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers -p no:cacheprovider"
testpaths = ["app/tests"]
markers = [
  "postgres_only: test owns a PostgreSQL-backed database fixture and opts out of the default SQLite fixture",
]
