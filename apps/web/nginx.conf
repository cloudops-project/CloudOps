pid /tmp/nginx.pid;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;

    # The host-exposed listener is HTTP. The second listener is reachable only
    # from the internal cloudflared service, which terminates public HTTPS.
    # Never derive this value from a client-provided forwarding header.
    map $server_port $browser_scheme {
        default http;
        8081    https;
    }

    server {
        listen 8080;
        listen 8081;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /api/health {
            proxy_pass http://api:8000/health;
            proxy_set_header Host api;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store" always;
        }

        location = /api/ready {
            proxy_pass http://api:8000/ready;
            proxy_set_header Host api;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store" always;
        }

        # Same-origin API proxy for the local demo stack.
        #
        # `proxy_pass` intentionally has NO trailing URI component. With a bare
        # `http://api:8000`, nginx forwards the *original* request URI unchanged,
        # so `/api/v1/auth/login` arrives at the API as `/api/v1/auth/login`.
        # Adding a trailing slash (`http://api:8000/`) would strip the `/api`
        # prefix and break every route, so do not "simplify" this.
        #
        # Host is pinned to `api` so the value matches the API's TRUSTED_HOSTS
        # allowlist without needing the temporary public tunnel hostname added
        # to it. No wildcard host or wildcard CORS origin is introduced.
        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host api;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # The browser-facing host and scheme. With TRUST_FORWARDED_HOST_SAME_ORIGIN
            # enabled, the API compares the request Origin against these to recognise a
            # genuinely same-origin request, so an ephemeral tunnel hostname never has to
            # be added to CORS_ALLOWED_ORIGINS or TRUSTED_HOSTS.
            #
            # These values overwrite any client-supplied forwarding headers.
            # $http_host preserves localhost's external port (5173), which is part
            # of the browser origin. Port 8081 is internal-only and represents
            # cloudflared's HTTPS ingress.
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $browser_scheme;
            proxy_set_header X-CloudOps-Demo-Proxy cloudops-demo-nginx;
            proxy_read_timeout 120s;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store" always;
        }

        location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
        }

        location / {
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
