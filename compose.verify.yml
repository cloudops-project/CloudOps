services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudops_test
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: cloudops_test_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops -d cloudops_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
