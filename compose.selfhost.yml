x-api-environment: &api-environment
  APP_ENV: production
  POSTGRES_DB: ${POSTGRES_DB:-cloudops}
  POSTGRES_USER: ${POSTGRES_USER:-cloudops}
  AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_TRUSTED_PRINCIPAL_ARNS: ${AWS_TRUSTED_PRINCIPAL_ARNS:-}
  AWS_TRUSTED_PRINCIPAL_ARN: ${AWS_TRUSTED_PRINCIPAL_ARN:-}
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
  JIRA_ENABLED: ${JIRA_ENABLED:-false}
  AWS_BEDROCK_ENABLED: ${AWS_BEDROCK_ENABLED:-false}
  AWS_SES_ENABLED: ${AWS_SES_ENABLED:-false}
  AWS_SES_REGION: ${AWS_SES_REGION:-ap-south-1}
  AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL:-}
  AWS_SES_FROM_NAME: ${AWS_SES_FROM_NAME:-CloudOps}
  AWS_SES_REPLY_TO: ${AWS_SES_REPLY_TO:-}
  AWS_SES_CONFIGURATION_SET: ${AWS_SES_CONFIGURATION_SET:-}
  REMEDIATION_EXECUTION_ENABLED: ${REMEDIATION_EXECUTION_ENABLED:-false}
  REMEDIATION_LIVE_AWS_ENABLED: "false"
  DEMO_SYNTHETIC_DISCOVERY: "false"
  TRUST_FORWARDED_HOST_SAME_ORIGIN: "false"
  FRONTEND_URL: https://${CLOUDOPS_DOMAIN:?CLOUDOPS_DOMAIN is required}
  CORS_ALLOWED_ORIGINS: https://${CLOUDOPS_DOMAIN:?CLOUDOPS_DOMAIN is required}
  TRUSTED_HOSTS: ${CLOUDOPS_DOMAIN:?CLOUDOPS_DOMAIN is required},api
  COOKIE_SECURE: "true"
  COOKIE_SAMESITE: lax
  HSTS_ENABLED: "true"

x-api-base: &api-base
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment: *api-environment
  # Root exists only long enough to read host-owned 0600 Docker file secrets.
  # selfhost-container-env.sh immediately execs the workload as UID 10001.
  user: "0:0"
  secrets:
    - postgres_password
    - jwt_secret_key
    - jira_token_encryption_key
  networks:
    - backend
    - egress
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudops}
      POSTGRES_USER: ${POSTGRES_USER:-cloudops}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - cloudops_postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migration:
    <<: *api-base
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /app/scripts/selfhost-container-env.sh
      - sh
      - -ec
      - >-
        python -m alembic upgrade head &&
        python -m alembic current | grep -q 0020_invitation_delivery_state
    restart: "no"

  api:
    <<: *api-base
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    command:
      - /app/scripts/selfhost-container-env.sh
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen(
          'http://127.0.0.1:8000/ready',timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  worker:
    <<: *api-base
    depends_on:
      migration:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      <<: *api-environment
      CLOUDOPS_HEARTBEAT_FILE: /tmp/cloudops-worker-heartbeat
    command:
      - /app/scripts/selfhost-container-env.sh
      - python
      - -m
      - app.worker.job_worker
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - app.worker.heartbeat
        - check
        - --path
        - /tmp/cloudops-worker-heartbeat
        - --max-age
        - "90"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    stop_signal: SIGTERM
    stop_grace_period: 35s
    restart: unless-stopped

  scheduler:
    <<: *api-base
    depends_on:
      migration:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      <<: *api-environment
      CLOUDOPS_HEARTBEAT_FILE: /tmp/cloudops-scheduler-heartbeat
    command:
      - /app/scripts/selfhost-container-env.sh
      - python
      - -m
      - app.worker.scheduler_worker
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - app.worker.heartbeat
        - check
        - --path
        - /tmp/cloudops-scheduler-heartbeat
        - --max-age
        - "90"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    stop_signal: SIGTERM
    stop_grace_period: 35s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
      - tunnel
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - "-"
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  cloudflared:
    build:
      context: .
      dockerfile: scripts/selfhost/cloudflared.Dockerfile
    depends_on:
      web:
        condition: service_healthy
    secrets:
      - cloudflare_tunnel_token
    # The entrypoint reads the 0600 file secret and immediately drops to UID 10001.
    user: "0:0"
    networks:
      - tunnel
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    # DAC_OVERRIDE lets the root-stage entrypoint read the 0600 tunnel-token
    # secret. SETGID and SETUID are the exact capabilities su-exec needs for
    # setgroups(2)/setgid(2)/setuid(2) when dropping to the non-root cloudops
    # user; without them the connector fails with "su-exec: setgroups:
    # Operation not permitted". No other capability is granted, cap_drop
    # remains ALL, and the final cloudflared process stays non-root.
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID

volumes:
  cloudops_postgres:
    name: cloudops_postgres

networks:
  backend:
    name: cloudops_backend
    internal: true
  egress:
    name: cloudops_egress
  tunnel:
    name: cloudops_tunnel

secrets:
  postgres_password:
    file: ./.cloudops/runtime/postgres_password
  jwt_secret_key:
    file: ./.cloudops/runtime/jwt_secret_key
  jira_token_encryption_key:
    file: ./.cloudops/runtime/jira_token_encryption_key
  cloudflare_tunnel_token:
    file: ./.cloudops/runtime/cloudflare_tunnel_token
