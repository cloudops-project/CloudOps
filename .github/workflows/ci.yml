name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selfhost-fast:
    name: Self-host static and unit gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install focused test tools
        run: python -m pip install "pytest>=9.0.3,<10" "ruff>=0.9,<1"

      - name: Shell and PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/cloudops.ps1",
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          bash -n cloudops.sh
          bash -n scripts/selfhost/container_env.sh
          bash -n scripts/aws-sandbox.sh
          $sandboxErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/aws-sandbox.ps1",
            [ref]$null,
            [ref]$sandboxErrors
          ) | Out-Null
          if ($sandboxErrors.Count -ne 0) { throw ($sandboxErrors | Out-String) }

      - name: Self-host Python lint and tests
        run: |
          python -m ruff check scripts/selfhost tests/features/one_command_selfhost
          python -m pytest tests/features/one_command_selfhost -ra

      - name: Render organization Compose without real credentials
        env:
          CLOUDOPS_DOMAIN: cloudops.example.test
          CLOUDFLARE_TUNNEL_TOKEN: ${{ format('{0}-{1}-selfhost-validation-only', github.run_id, github.run_attempt) }}
        run: |
          mkdir -p .cloudops/runtime
          for name in postgres_password jwt_secret_key jira_token_encryption_key cloudflare_tunnel_token; do
            printf '%s\n' 'synthetic-ci-value-not-a-real-secret' > ".cloudops/runtime/$name"
          done
          docker compose --env-file .env.selfhost.example -f compose.selfhost.yml config --quiet
          rendered="$(docker compose --env-file .env.selfhost.example -f compose.selfhost.yml config)"
          ! grep -F 'synthetic-ci-value-not-a-real-secret' <<< "$rendered"
          ! grep -E 'published: (5432|8000)' <<< "$rendered"
          rm -rf .cloudops/runtime

  selfhost-containers:
    name: Self-host container gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CLOUDOPS_DOMAIN: cloudops.example.test
      CLOUDFLARE_TUNNEL_TOKEN: ${{ format('{0}-{1}-selfhost-validation-only', github.run_id, github.run_attempt) }}
      CLOUDOPS_COMPOSE_PROJECT: cloudops-selfhost-ci

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Initialize synthetic test-only configuration
        run: python -c "from pathlib import Path; from scripts.selfhost.configure import configure; configure(Path.cwd(), interactive=False)"

      - name: Build self-host images
        run: >-
          docker compose --env-file .env.selfhost -p cloudops-selfhost-ci
          -f compose.selfhost.yml build api web cloudflared

      - name: Migration-gated startup and internal health
        run: |
          set -euo pipefail
          compose=(docker compose --env-file .env.selfhost -p cloudops-selfhost-ci -f compose.selfhost.yml)
          trap '"${compose[@]}" down --volumes --remove-orphans' EXIT
          "${compose[@]}" up -d postgres
          "${compose[@]}" up --abort-on-container-exit --exit-code-from migration migration
          "${compose[@]}" up -d api worker scheduler web
          for attempt in $(seq 1 60); do
            states="$("${compose[@]}" ps --format json)"
            if grep -q '"Health":"unhealthy"' <<< "$states"; then
              "${compose[@]}" ps
              "${compose[@]}" logs --no-color --tail=100
              exit 1
            fi
            healthy_count="$(grep -o '"Health":"healthy"' <<< "$states" | wc -l)"
            if [ "$healthy_count" -ge 5 ]; then break; fi
            sleep 5
          done
          if [ "$healthy_count" -lt 5 ]; then
            "${compose[@]}" ps
            "${compose[@]}" logs --no-color --tail=100
            exit 1
          fi
          "${compose[@]}" exec -T web wget -q -O - http://127.0.0.1:8080/api/health
          "${compose[@]}" exec -T web wget -q -O - http://127.0.0.1:8080/api/ready
          "${compose[@]}" exec -T postgres \
            psql -U cloudops -d cloudops -v ON_ERROR_STOP=1 \
            -c 'CREATE TABLE selfhost_acceptance_marker (id integer PRIMARY KEY); INSERT INTO selfhost_acceptance_marker VALUES (1);'
          python scripts/selfhost/cloudops.py backup
          dump="$(find .cloudops/backups -name '*.dump' -print -quit)"
          test -n "$dump"
          "${compose[@]}" exec -T postgres \
            psql -U cloudops -d cloudops -v ON_ERROR_STOP=1 \
            -c 'DELETE FROM selfhost_acceptance_marker;'
          python scripts/selfhost/cloudops.py restore "$dump" --confirm RESTORE-CLOUDOPS-DATA
          test "$("${compose[@]}" exec -T postgres \
            psql -U cloudops -d cloudops -Atc 'SELECT count(*) FROM selfhost_acceptance_marker;')" = "1"
          "${compose[@]}" down
          "${compose[@]}" up -d postgres
          "${compose[@]}" up --abort-on-container-exit --exit-code-from migration migration
          "${compose[@]}" up -d api worker scheduler web
          "${compose[@]}" exec -T postgres pg_isready -U cloudops -d cloudops

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudops_test
          POSTGRES_USER: cloudops
          POSTGRES_PASSWORD: cloudops_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cloudops -d cloudops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: sqlite:///./cloudops_ci_test.db
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://cloudops:cloudops_test_password@localhost:5433/cloudops_test
      JWT_SECRET_KEY: ci-local-verification-key-with-at-least-32-characters
      APP_ENV: testing

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install package with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: >-
          python -m ruff check
          app
          alembic/versions/0014_distributed_platform_jobs.py
          alembic/versions/0015_notification_delivery_evidence.py
          alembic/versions/0016_governed_remediation.py
          alembic/versions/0017_remediation_json_trigger.py
          ../../scripts/migration_preflight.py
          ../../scripts/deployment_smoke.py
          ../../scripts/staging_smoke.py

      - name: Mypy
        run: python -m mypy app

      - name: Dependency consistency
        run: python -m pip check

      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit --skip-editable --progress-spinner off

      - name: Backend tests
        run: python -m pytest app/tests -ra

      - name: Alembic - single head
        run: |
          python -m alembic heads | tee /tmp/alembic_heads.txt
          test "$(wc -l < /tmp/alembic_heads.txt)" -eq 1

      - name: Alembic - upgrade disposable PostgreSQL database
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://cloudops:cloudops_test_password@localhost:5433/cloudops_test

      - name: Alembic - current revision
        run: python -m alembic current
        env:
          DATABASE_URL: postgresql+psycopg://cloudops:cloudops_test_password@localhost:5433/cloudops_test

      - name: Alembic - schema check
        run: python -m alembic check
        env:
          DATABASE_URL: postgresql+psycopg://cloudops:cloudops_test_password@localhost:5433/cloudops_test

      - name: Migration preflight
        run: python ../../scripts/migration_preflight.py
        env:
          DATABASE_URL: postgresql+psycopg://cloudops:cloudops_test_password@localhost:5433/cloudops_test

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

  containers:
    name: Containers
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t cloudops-api:ci .

      - name: Build production web image
        run: docker build -f apps/web/Dockerfile -t cloudops-web:ci .

      - name: Validate Compose configuration
        run: docker compose -f compose.yml config --quiet

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          zricethezav/gitleaks:v8.28.0
          detect --source=/repo --redact --no-banner
          --gitleaks-ignore-path=/repo/.gitleaksignore

  infrastructure:
    name: Terraform and IaC security
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install sandbox test tools
        run: python -m pip install "pytest>=9.0.3,<10"

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive infra

      - name: Terraform validate bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform validate environments
        run: |
          for environment in staging production; do
            terraform -chdir="infra/environments/${environment}" init -backend=false
            terraform -chdir="infra/environments/${environment}" validate
          done

      - name: Terraform validate remediation sandbox
        run: |
          terraform -chdir=infra/sandbox init -backend=false
          terraform -chdir=infra/sandbox validate
          terraform -chdir=infra/sandbox test
          python -m pytest infra/sandbox/tests/test_sandbox_static.py -q
          python -m pytest tests/security/test_live_remediation_harness.py -q

      - name: Checkov
        run: >-
          docker run --rm
          -v "$PWD:/workspace"
          bridgecrew/checkov:3.2.471
          --directory /workspace/infra
          --framework terraform
          --compact
          --quiet
