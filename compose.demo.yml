services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudops_demo
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: cloudops_demo_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops -d cloudops_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - cloudops_demo_postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/api/v1/info"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://cloudops:cloudops_demo_password@postgres:5432/cloudops_demo
      JWT_SECRET_KEY: demo-only-jwt-secret-at-least-32-characters
      AWS_TRUSTED_PRINCIPAL_ARN: arn:aws:iam::123456789012:root
      AWS_ACCESS_KEY_ID: demo
      AWS_SECRET_ACCESS_KEY: demo
      AWS_SESSION_TOKEN: demo
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: us-east-1
      AI_PROVIDER: mock
      NOTIFICATION_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM_EMAIL: cloudops-demo@example.local
      SMTP_FROM_NAME: CloudOps Demo
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      TRUSTED_HOSTS: localhost,127.0.0.1,api,testserver
      # Demo-only: replay seeded synthetic inventory instead of calling AWS STS.
      # Settings validation refuses this when APP_ENV=production.
      DEMO_SYNTHETIC_DISCOVERY: "true"
      # Enables the mock/dry-run executor only. REMEDIATION_LIVE_AWS_ENABLED stays
      # false (its default), so execute() still refuses any live AWS mutation.
      REMEDIATION_EXECUTION_ENABLED: "true"
      # Lets the API recognise a same-origin request arriving through the temporary
      # Cloudflare Quick Tunnel hostname, so the random *.trycloudflare.com URL never
      # needs adding to CORS_ALLOWED_ORIGINS or TRUSTED_HOSTS. Refused in
      # production-like environments. Not a wildcard: the Origin must exactly equal
      # the proxy-reported browser-facing origin.
      TRUST_FORWARDED_HOST_SAME_ORIGIN: "true"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
      python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
  # Enqueues due schedule occurrences. Runs by default so the demo does not
  # depend on remembering a --profile flag.
  scheduler-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://cloudops:cloudops_demo_password@postgres:5432/cloudops_demo
      JWT_SECRET_KEY: demo-only-jwt-secret-at-least-32-characters
      AWS_ACCESS_KEY_ID: demo
      AWS_SECRET_ACCESS_KEY: demo
      AWS_SESSION_TOKEN: demo
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: us-east-1
      AI_PROVIDER: mock
      NOTIFICATION_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      DEMO_SYNTHETIC_DISCOVERY: "true"
    depends_on:
      api:
        condition: service_healthy
    command: python -m app.worker.scheduler_worker
    stop_signal: SIGTERM
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Processes queued platform jobs. "Run now" only *enqueues* a SCHEDULED_SCAN
  # job, so without this service a demo scan run would never leave PENDING.
  job-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://cloudops:cloudops_demo_password@postgres:5432/cloudops_demo
      JWT_SECRET_KEY: demo-only-jwt-secret-at-least-32-characters
      AWS_TRUSTED_PRINCIPAL_ARN: arn:aws:iam::123456789012:root
      AWS_ACCESS_KEY_ID: demo
      AWS_SECRET_ACCESS_KEY: demo
      AWS_SESSION_TOKEN: demo
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: us-east-1
      AI_PROVIDER: mock
      NOTIFICATION_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM_EMAIL: cloudops-demo@example.local
      SMTP_FROM_NAME: CloudOps Demo
      DEMO_SYNTHETIC_DISCOVERY: "true"
      REMEDIATION_EXECUTION_ENABLED: "true"
    depends_on:
      api:
        condition: service_healthy
    command: python -m app.worker.job_worker
    stop_signal: SIGTERM
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Empty base URL keeps the bundle on same-origin relative /api/v1 paths,
        # so one public URL or tunnel serves both the SPA and the API.
        VITE_API_BASE_URL: ""
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:8080"

  # Temporary public access for the demo, behind the `tunnel` profile so the
  # default stack stays purely local.
  #
  #   docker compose -f compose.demo.yml --profile tunnel up -d cloudflared
  #
  # Quick Tunnel needs no Cloudflare account, API token, or credentials: it
  # allocates a random *.trycloudflare.com hostname that changes on every
  # restart and disappears when the process exits. It points at `web`, so one
  # origin serves the SPA and the proxied /api/ routes.
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    profiles:
      - tunnel
    depends_on:
      web:
        condition: service_started
    command: tunnel --no-autoupdate --url http://web:8081
    restart: unless-stopped

volumes:
  cloudops_demo_postgres:
